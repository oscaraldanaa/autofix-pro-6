name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + Pruebas (cobertura ≥ 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install ruff pytest-cov 
      - run: ruff check src tests
      - name: Pytest (falla si cobertura < 80%)
        run: pytest --cov=src --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    name: Build y smoke test con Docker Compose
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Preparar .env de CI
        run: |
          cp .env.example .env
          sed -i 's/cambiar_esta_clave/ci_password/g' .env
      - name: Levantar app + db
        run: docker compose up -d --build --wait app
      - name: Health check
        run: curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8000/health
      - name: Swagger UI disponible
        run: curl --fail http://localhost:8000/docs -o /dev/null
      - name: Pruebas en contenedor dedicado
        run: docker compose run --rm tests
      - if: always()
        run: docker compose down -v

  deploy:
    name: Despliegue (Render Deploy Hook)
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Disparar despliegue
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then echo "Sin secret RENDER_DEPLOY_HOOK: despliegue omitido"; exit 0; fi
          curl --fail -X POST "$RENDER_DEPLOY_HOOK"
